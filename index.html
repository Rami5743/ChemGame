<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ChemGame</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header>
  <h1>ChemGame</h1>
  <div class="head-end">
    <a class="rules" href="materials/inst/Hebrew-instructions.pdf" target="_blank" rel="noopener">חוקי המשחק</a>
    <div id="status" class="status" data-state="off">מנותק</div>
  </div>
</header>

<main>

  <div id="alert" class="alert hidden"></div>

  <section id="view-name" class="view">
    <h2 id="name-title">משחק חדש</h2>
    <label for="name-input">השם שלך, אם בא לך</label>
    <div class="row">
      <input id="name-input" maxlength="16" autocomplete="off" placeholder="אפשר להשאיר ריק">
      <button id="name-go" class="primary">צור משחק</button>
    </div>
    <p id="name-note" class="note"></p>
    <p><button id="name-fresh" class="hidden">פתח משחק חדש במקום</button></p>
  </section>

  <section id="view-lobby" class="view hidden">
    <h2>חדר המתנה</h2>

    <div class="linkbox">
      <label for="share">הקישור למשחק</label>
      <div class="row">
        <input id="share" readonly>
        <button id="copy">העתק</button>
      </div>
      <p class="note">שלח את הקישור לכל מי שאתה רוצה שישחק.</p>
    </div>

    <h3>שחקנים</h3>
    <ol id="roster" class="roster"></ol>

    <div id="host-controls" class="hidden">
      <div class="settings">
        <div class="field">
          <label for="set-atoms">קלפי אטום לכל שחקן</label>
          <input id="set-atoms" type="number" min="1" max="24" value="12">
        </div>
        <div class="field">
          <label for="set-mols">קלפי מולקולה לכל שחקן</label>
          <input id="set-mols" type="number" min="1" max="8" value="3">
        </div>
      </div>
      <button id="start" class="primary">התחל משחק</button>
      <p class="note">הסדר ברשימה הוא סדר התורות. עם ההתחלה החדר ננעל.</p>
    </div>

    <p id="deal-note" class="note"></p>
    <p id="lobby-note" class="note"></p>
  </section>

  <section id="view-game" class="view hidden">
    <div class="board">

      <aside class="side">
        <h3>סדר השחקנים</h3>
        <ol id="players" class="players"></ol>
      </aside>

      <div class="main">
        <div id="turn-banner" class="banner"></div>

        <h3>אזור המשחק</h3>
        <div id="table" class="table">
          <div id="table-mol" class="slot"></div>
          <div id="table-units" class="units"></div>
        </div>

        <div id="decks" class="decks"></div>
        <div id="actions" class="actions"></div>
        <p id="game-note" class="note"></p>

        <h3>הקלפים שלך</h3>
        <div id="hand-mols" class="hand"></div>
        <div id="hand-atoms" class="hand"></div>
      </div>

    </div>
  </section>

  <div id="overlay" class="overlay hidden">
    <div class="sheet">
      <h3 id="overlay-title"></h3>
      <div id="overlay-cards" class="hand"></div>
    </div>
  </div>

</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/mqtt/5.10.1/mqtt.min.js"></script>
<script type="module" src="js/app.js"></script>
</body>
</html>
